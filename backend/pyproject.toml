[project]
name = "trash-scan-api"
version = "1.0.0"
description = "Trash Scan reconnaissance dashboard API (Phase 1 foundation)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
