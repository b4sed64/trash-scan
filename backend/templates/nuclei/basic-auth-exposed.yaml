id: trashscan-basic-auth-exposed

info:
  name: HTTP Basic Authentication Prompt
  author: trash-scan
  severity: info
  description: The endpoint challenges with HTTP Basic authentication. Credentials sent this way are base64-encoded, not encrypted; confirm the channel is TLS-protected.
  tags: exposure,auth

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 401
      - type: word
        part: header
        words:
          - "WWW-Authenticate: Basic"
          - "WWW-Authenticate: basic"
        condition: or
