id: trashscan-env-file-exposure

info:
  name: Exposed .env File
  author: trash-scan
  severity: high
  description: A readable .env file is exposed at the web root, which commonly contains credentials and secret keys.
  tags: exposure,config,secret

http:
  - method: GET
    path:
      - "{{BaseURL}}/.env"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "APP_KEY="
          - "DB_PASSWORD="
          - "DB_CONNECTION="
          - "SECRET_KEY="
        condition: or
      - type: status
        status:
          - 200
      - type: word
        part: header
        negative: true
        words:
          - "text/html"
