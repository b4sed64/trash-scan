id: trashscan-eol-apache-httpd

info:
  name: Apache HTTP Server End-of-Life
  author: trash-scan
  severity: info
  description: The Server header discloses an Apache HTTP Server version that has reached end-of-life and no longer receives security updates from the vendor.
  reference:
    - https://endoflife.date/apache
  tags: tech,eol,disclosure,apache

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers:
      - type: dsl
        dsl:
          - contains(server, 'Apache')
          - compare_versions(version, '<=2.2.34')
        condition: and
    extractors:
      - type: regex
        part: header
        name: version
        group: 1
        regex:
          - 'Server:\s*Apache/([0-9.]+)'
