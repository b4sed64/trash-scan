id: trashscan-eol-php

info:
  name: PHP End-of-Life
  author: trash-scan
  severity: info
  description: A response header discloses a PHP version that has reached end-of-life and no longer receives security updates from the vendor.
  reference:
    - https://endoflife.date/php
  tags: tech,eol,disclosure,php

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers:
      - type: dsl
        dsl:
          - contains(tolower(header), 'php')
          - compare_versions(version, '<8.0.0')
        condition: and
    extractors:
      - type: regex
        part: header
        name: version
        group: 1
        regex:
          - 'X-Powered-By:\s*PHP/([0-9.]+)'
          - 'Server:.*PHP/([0-9.]+)'
