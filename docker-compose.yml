# Trash Scan — full stack (API, worker, beat, web, Postgres, Redis) for Docker
# Desktop on Windows; portable to Linux / Kali.
#
#   docker compose up --build
#
# Then open http://localhost:8080 and complete first-run administrator setup.
# Offline demo:  SCANNER_MODE=fake docker compose up -d --build  &&  ./scripts/demo_seed.sh
services:
  db:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_USER: trashscan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trashscan}
      POSTGRES_DB: trashscan
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trashscan"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: ["sh", "entrypoint.sh"]
    environment: &backend_env
      TRASHSCAN_DATABASE_URL: postgresql+psycopg://trashscan:${POSTGRES_PASSWORD:-trashscan}@db:5432/trashscan
      TRASHSCAN_AUTO_CREATE: "0"
      TRASHSCAN_SESSION_COOKIE_SECURE: "false"
      TRASHSCAN_FRONTEND_ORIGIN: "http://localhost:8080"
      TRASHSCAN_ENABLE_DNS_RESOLUTION: "true"
      TRASHSCAN_REDIS_URL: redis://redis:6379/0
      TRASHSCAN_SCANNER_MODE: "${SCANNER_MODE:-real}"
      TRASHSCAN_RESULT_ROOT: /app/artifacts/scans
      TRASHSCAN_DNS_RESOLVERS: "${DNS_RESOLVERS:-}"
      TRASHSCAN_ALLOW_RAW_PACKET: "false"
      TRASHSCAN_RUN_SEED: "${RUN_SEED:-0}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - artifacts:/app/artifacts
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build: ./backend
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *backend_env
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - artifacts:/app/artifacts

  beat:
    build: ./backend
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=INFO"]
    environment: *backend_env
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - artifacts:/app/artifacts

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db_data:
  artifacts:
